[project]
name = "dqn-mspacman"
version = "1.0.0"
description = "Deep Q-Learning Agent for Atari Ms. Pac-Man"
authors = [{ name = "Aravind Balaji" }]
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88
known_third_party = ["torch", "gymnasium", "numpy", "matplotlib"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
per-file-ignores = ["__init__.py:F401"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["dqn_mspacman.py"]
python_functions = ["run_smoke_tests"]
addopts = "--doctest-modules --tb=short -q"
